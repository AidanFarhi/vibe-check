# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_REGION: iad
  FLY_ORG: personal

jobs:
  deploy:
    name: Deploy app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl secrets set DATABASE_URL="${{ secrets.DATABASE_URL }}"
      - run: flyctl deploy --remote-only

  setup:
    name: Setup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
        github.event.action == 'opened'
        || github.event.action == 'reopened'
        || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    outputs:
      db_url: ${{ steps.get_db_url.outputs.db_url }}
    steps:
      - name: Create Neon Branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Get connection string
        id: get_db_url
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          BRANCH_NAME="preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}"
          ENCODED_BRANCH="${BRANCH_NAME//\//%2F}"
          DB_URL=$(curl -sf \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?branch_name=${ENCODED_BRANCH}&role_name=neondb_owner&database_name=neondb" \
            -H "Authorization: Bearer $NEON_API_KEY" | jq -r '.uri')
          echo "db_url=$DB_URL" >> $GITHUB_OUTPUT

  review_app:
    name: Deploy PR Preview
    needs: [setup, create_neon_branch]
    if: |
      github.event_name == 'pull_request' && (
        github.event.action == 'opened'
        || github.event.action == 'reopened'
        || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: review
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Deploy PR app to Fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.2.1
        with:
          name: pr-${{ github.event.number }}-vibe-check
          secrets: DATABASE_URL=${{ needs.create_neon_branch.outputs.db_url }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

  destroy_review_app:
    name: Destroy PR Preview
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Destroy PR app on Fly.io
        uses: superfly/fly-pr-review-apps@1.2.1
        with:
          name: pr-${{ github.event.number }}-vibe-check
