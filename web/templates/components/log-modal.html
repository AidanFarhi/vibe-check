{{ define "log-modal" }}
<div class="modal-overlay{{ if .Open }} open{{ end }}" id="modalOverlay" onclick="handleOverlayClick(event)">
    <div class="modal">
        <div class="modal-handle" onclick="closeModal()" style="cursor:pointer"></div>
        <div class="modal-title">How are you today?</div>

        <form hx-post="/entries" hx-target="#modalOverlay" hx-swap="outerHTML">
            <input type="hidden" name="period" id="form-period" value="{{ if .Chart.Period }}{{ .Chart.Period }}{{ else }}7D{{ end }}">
            <input type="hidden" name="metric" id="form-metric" value="{{ if .Chart.Metric }}{{ .Chart.Metric }}{{ else }}score{{ end }}">
            {{ if .Error }}
            <div class="form-error">{{ .Error }}</div>
            {{ end }}

            <div class="form-row">
                <div class="form-label">
                    <span class="form-label-name">Energy</span>
                    <span class="form-label-value" id="val-energy">5</span>
                </div>
                <input type="range" name="energy" min="1" max="10" value="5" oninput="updateVal('energy',this.value)">
            </div>
            <div class="form-row">
                <div class="form-label">
                    <span class="form-label-name">Sleep Quality</span>
                    <span class="form-label-value" id="val-sleep">5</span>
                </div>
                <input type="range" name="sleep" min="1" max="10" value="5" oninput="updateVal('sleep',this.value)">
            </div>
            <div class="form-row">
                <div class="form-label">
                    <span class="form-label-name">Happiness</span>
                    <span class="form-label-value" id="val-happiness">5</span>
                </div>
                <input type="range" name="happiness" min="1" max="10" value="5" oninput="updateVal('happiness',this.value)">
            </div>
            <div class="form-row">
                <div class="form-label">
                    <span class="form-label-name">Pain</span>
                    <span class="form-label-value" id="val-pain">5</span>
                </div>
                <input type="range" name="pain" min="1" max="10" value="5" oninput="updateVal('pain',this.value)">
            </div>
            <div class="form-row">
                <div class="form-label">
                    <span class="form-label-name">Depression</span>
                    <span class="form-label-value" id="val-depression">5</span>
                </div>
                <input type="range" name="depression" min="1" max="10" value="5" oninput="updateVal('depression',this.value)">
            </div>
            <div class="form-row">
                <div class="form-label"><span class="form-label-name">Note</span></div>
                <textarea name="note" placeholder="Anything on your mind today…"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-save">Save Entry</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
