{{ define "chart-card" }}
<div class="card chart-card" id="chart-card">
    {{ template "chart-card-body" . }}
</div>
{{ end }}

{{ define "chart-card-body" }}

    <div class="time-filter">
        <button class="time-btn active" data-period="7D"  onclick="setTime(this)">7D</button>
        <button class="time-btn"        data-period="30D" onclick="setTime(this)">30D</button>
        <button class="time-btn"        data-period="3M"  onclick="setTime(this)">3M</button>
        <button class="time-btn"        data-period="6M"  onclick="setTime(this)">6M</button>
        <button class="time-btn"        data-period="1Y"  onclick="setTime(this)">1Y</button>
    </div>

    <div class="metric-pills">
        <button class="pill active" data-metric="score"      onclick="setMetricPill(this)">Score</button>
        <button class="pill"        data-metric="energy"     onclick="setMetricPill(this)">Energy</button>
        <button class="pill"        data-metric="sleep"      onclick="setMetricPill(this)">Sleep</button>
        <button class="pill"        data-metric="happiness"  onclick="setMetricPill(this)">Happiness</button>
        <button class="pill"        data-metric="pain"       onclick="setMetricPill(this)">Pain</button>
        <button class="pill"        data-metric="depression" onclick="setMetricPill(this)">Depression</button>
    </div>

    <div id="lineChartWrap">
        <svg class="chart-svg" viewBox="0 0 300 100" preserveAspectRatio="none">
            <line x1="0" y1="10" x2="300" y2="10" stroke="#1a1d27" stroke-width="1"/>
            <line x1="0" y1="42" x2="300" y2="42" stroke="#1a1d27" stroke-width="1"/>
            <line x1="0" y1="74" x2="300" y2="74" stroke="#1a1d27" stroke-width="1"/>

            <g class="mline" id="g-score" data-metric="score">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "score" }}" fill="#7aadff" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "score" }}" fill="none" stroke="#7aadff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "score" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "score") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "score") }}" r="4" fill="#7aadff" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "score") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "score") }}" r="2.5" fill="#7aadff"/>
                {{ end }}
            </g>

            <g class="mline" id="g-energy" data-metric="energy" style="opacity:0">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "energy" }}" fill="#4ecfb0" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "energy" }}" fill="none" stroke="#4ecfb0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "energy" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "energy") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "energy") }}" r="4" fill="#4ecfb0" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "energy") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "energy") }}" r="2.5" fill="#4ecfb0"/>
                {{ end }}
            </g>

            <g class="mline" id="g-sleep" data-metric="sleep" style="opacity:0">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "sleep" }}" fill="#38b8a0" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "sleep" }}" fill="none" stroke="#38b8a0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "sleep" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "sleep") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "sleep") }}" r="4" fill="#38b8a0" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "sleep") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "sleep") }}" r="2.5" fill="#38b8a0"/>
                {{ end }}
            </g>

            <g class="mline" id="g-happiness" data-metric="happiness" style="opacity:0">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "happiness" }}" fill="#7eb8f7" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "happiness" }}" fill="none" stroke="#7eb8f7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "happiness" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "happiness") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "happiness") }}" r="4" fill="#7eb8f7" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "happiness") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "happiness") }}" r="2.5" fill="#7eb8f7"/>
                {{ end }}
            </g>

            <g class="mline" id="g-pain" data-metric="pain" style="opacity:0">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "pain" }}" fill="#d98878" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "pain" }}" fill="none" stroke="#d98878" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "pain" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "pain") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "pain") }}" r="4" fill="#d98878" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "pain") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "pain") }}" r="2.5" fill="#d98878"/>
                {{ end }}
            </g>

            <g class="mline" id="g-depression" data-metric="depression" style="opacity:0">
                <path class="mline-area" d="{{ chartAreaPath .Chart.Days "depression" }}" fill="#a84560" fill-opacity="0.07"/>
                <path d="{{ chartLinePath .Chart.Days "depression" }}" fill="none" stroke="#a84560" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
                {{ if chartHasDot .Chart.Days "depression" }}
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "depression") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "depression") }}" r="4" fill="#a84560" fill-opacity="0.2"/>
                <circle cx="{{ printf "%.1f" (chartDotX .Chart.Days "depression") }}" cy="{{ printf "%.1f" (chartDotY .Chart.Days "depression") }}" r="2.5" fill="#a84560"/>
                {{ end }}
            </g>
        </svg>

        <div class="chart-days">
            {{ range .Chart.Days }}<span{{ if eq .Label "Today" }} class="today"{{ end }}>{{ .Label }}</span>{{ end }}
        </div>
    </div>


</div>
{{ end }}
