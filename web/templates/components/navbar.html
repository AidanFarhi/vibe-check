{{ define "navbar" }}
<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 14c2.5-5 5-5 7.5 0s5 5 7.5 0 5-5 7-2"></path>
            </svg>
        </div>
        <div>
            <div class="brand-name">Vibe Check</div>
            <div class="brand-sub">daily wellness</div>
        </div>
    </div>

    <nav class="nav">
        <button class="nav-item active" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M3 10h18M8 3v4M16 3v4"></path>
                </svg>
            </span>
            <span class="nav-label">Today</span>
            <span class="nav-dot pending"></span>
        </button>
        <button class="nav-item" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                    <path d="M3 4v5h5"></path>
                    <path d="M12 7v5l3 2"></path>
                </svg>
            </span>
            <span class="nav-label">History</span>
        </button>
        <button class="nav-item" type="button">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19V5M4 19h16"></path>
                    <path d="M8 15l3-4 3 3 5-7"></path>
                </svg>
            </span>
            <span class="nav-label">Insights</span>
        </button>
    </nav>

    <div class="streak-card">
        <div class="streak-row">
            <div class="streak-num">6</div>
            <div class="streak-label">day<br>streak</div>
        </div>
        <div class="streak-bars">
            <span class="bar on"  title="Apr 27"></span>
            <span class="bar on"  title="Apr 28"></span>
            <span class="bar on"  title="Apr 29"></span>
            <span class="bar on"  title="Apr 30"></span>
            <span class="bar on"  title="May 1"></span>
            <span class="bar on"  title="May 2"></span>
            <span class="bar today" title="May 3"></span>
        </div>
    </div>
</aside>
{{ end }}
