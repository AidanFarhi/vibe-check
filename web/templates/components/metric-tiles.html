{{ define "metric-tiles" }}
<div class="metrics-grid">
    <div class="metric-card active" onclick="selectMetric('energy')" data-metric="energy">
        <div class="metric-name">Energy</div>
        <div class="metric-value" style="color:#4ecfb0">8</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:80%;background:#4ecfb0;opacity:0.8"></div>
        </div>
        <div class="metric-trend good">↑ 4 from yesterday</div>
    </div>
    <div class="metric-card" onclick="selectMetric('sleep')" data-metric="sleep">
        <div class="metric-name">Sleep</div>
        <div class="metric-value" style="color:#38b8a0">7</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:70%;background:#38b8a0;opacity:0.8"></div>
        </div>
        <div class="metric-trend good">↑ 2 from yesterday</div>
    </div>
    <div class="metric-card" onclick="selectMetric('sadness')" data-metric="sadness">
        <div class="metric-name">Sadness</div>
        <div class="metric-value" style="color:#d07085">3</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:30%;background:#d07085"></div>
        </div>
        <div class="metric-trend good">↓ 3 from yesterday</div>
    </div>
    <div class="metric-card" onclick="selectMetric('anger')" data-metric="anger">
        <div class="metric-name">Anger</div>
        <div class="metric-value" style="color:#c44f4f">2</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:20%;background:#c44f4f"></div>
        </div>
        <div class="metric-trend good">↓ 3 from yesterday</div>
    </div>
    <div class="metric-card" onclick="selectMetric('pain')" data-metric="pain">
        <div class="metric-name">Pain</div>
        <div class="metric-value" style="color:#d98878">2</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:20%;background:#d98878"></div>
        </div>
        <div class="metric-trend good">↓ 1 from yesterday</div>
    </div>
    <div class="metric-card" onclick="selectMetric('depression')" data-metric="depression">
        <div class="metric-name">Depression</div>
        <div class="metric-value" style="color:#a84560">3</div>
        <div class="metric-bar-track">
            <div class="metric-bar-fill" style="width:30%;background:#a84560"></div>
        </div>
        <div class="metric-trend good">↓ 2 from yesterday</div>
    </div>
</div>
{{ end }}
