{{ define "today-card" }}
<div class="card today-card" id="todayCard" onclick="selectMetric('score')">
    <div>
        <div class="card-title" id="todayTitle">Today's Score</div>
        <div class="today-score" id="todayScore">{{ printf "%.1f" .TodayEntry.Score }}</div>
        <div class="today-label" id="todayLabel">{{ .ScoreLabel }}</div>
    </div>
    <div class="today-streak" id="todayStreak">
        <strong>{{ .Streak }}</strong>
        day streak
    </div>
</div>
{{ end }}
